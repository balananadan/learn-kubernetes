apiVersion: v1
kind: Pod
metadata:
  name: multi-container
spec:
  volume:
    - name: simple
      emptyDir: {}
  containers:
    - name: nginx
      image: nginx
    - volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: simple
    - name: redhat
      image: rkalluru/learnk8s:rhel9-bare
      volumeMounts:
        - mountPath: /opt
          name: simple



